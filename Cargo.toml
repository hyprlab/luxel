[package]
name = "luxel"
version = "1.2.2"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hyprlab/luxel"
description = "Control LIFX smart bulbs and SmartLife devices from the GNOME desktop"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
lifx-core = "0.4"
async-channel = "2"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tuya (SmartLife) local protocol crypto
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1"
getrandom = "0.2"

[profile.release]
lto = true
strip = true
